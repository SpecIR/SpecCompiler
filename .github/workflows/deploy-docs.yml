name: Deploy Documentation

on:
  push:
    branches: [main]
    tags: ['docs*']
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:
  # Called by the release pipeline (docker-publish.yml) after the image is built,
  # so a `v*` release tag updates gh-pages automatically with the just-built image.
  workflow_call:
    inputs:
      image:
        description: "Image ref to build docs with (defaults to :latest when run standalone)."
        type: string
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Resolve docs image
        run: |
          if [ -n "${{ inputs.image }}" ]; then
            echo "DOC_IMAGE=${{ inputs.image }}" >> "$GITHUB_ENV"
          else
            echo "DOC_IMAGE=${REGISTRY}/${IMAGE_NAME}:latest" >> "$GITHUB_ENV"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests and generate TRR
        run: |
          # Run e2e tests with JUnit output (needed for engineering docs TRR)
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e SPECCOMPILER_HOME=/workspace \
            -e SPECCOMPILER_DIST=/opt/speccompiler \
            --entrypoint bash \
            "${{ env.DOC_IMAGE }}" \
            tests/run.sh --junit || true

          # Generate TRR markdown from JUnit XML
          mkdir -p docs/engineering_docs/test_results
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e SPECCOMPILER_HOME=/workspace \
            -e SPECCOMPILER_DIST=/opt/speccompiler \
            --entrypoint pandoc \
            "${{ env.DOC_IMAGE }}" \
            --lua-filter tests/helpers/trr_generator.lua \
              --metadata junit_path=tests/reports/junit.xml \
              --metadata output_path=docs/engineering_docs/test_results/tr.md \
              < /dev/null

      - name: Build all documentation
        run: |
          set -euo pipefail
          for project in \
            docs/engineering_docs/project.yaml \
            docs/user_docs/project.yaml \
            docs/commonspec/project.yaml \
            docs/specir/project.yaml; do
            echo "::group::Building $project"
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -v "${{ github.workspace }}:/workspace" \
              -w /workspace \
              -e SPECCOMPILER_HOME=/workspace \
              -e SPECCOMPILER_DIST=/opt/speccompiler \
              -e 'LUA_PATH=/workspace/src/?.lua;/workspace/src/?/init.lua;/workspace/?.lua;/workspace/?/init.lua;/opt/speccompiler/vendor/?.lua;/opt/speccompiler/vendor/?/init.lua;/opt/speccompiler/vendor/slaxml/?.lua;;' \
              "${{ env.DOC_IMAGE }}" \
              build "$project"
            echo "::endgroup::"
          done

      - name: Generate Pages index from README
        run: |
          mkdir -p docs/build
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            --entrypoint pandoc \
            "${{ env.DOC_IMAGE }}" \
            README.md \
              --from=gfm \
              --to=html5 \
              --standalone \
              --metadata title="SpecCompiler" \
              --output=docs/build/index.html

      - name: Deploy to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch gh-pages branch or create it
          if git fetch origin gh-pages; then
            git worktree add _gh-pages origin/gh-pages
          else
            git worktree add --orphan _gh-pages
            cd _gh-pages && git checkout --orphan gh-pages && cd ..
          fi

          # Engineering docs
          rm -rf _gh-pages/engineering
          mkdir -p _gh-pages/engineering/downloads
          cp docs/engineering_docs/build/www/* _gh-pages/engineering/
          cp docs/engineering_docs/build/docx/*.docx _gh-pages/engineering/downloads/

          # User docs
          rm -rf _gh-pages/manual
          mkdir -p _gh-pages/manual/downloads
          cp docs/user_docs/build/www/* _gh-pages/manual/
          cp docs/user_docs/build/docx/*.docx _gh-pages/manual/downloads/

          # CommonSpec language specification
          rm -rf _gh-pages/commonspec
          mkdir -p _gh-pages/commonspec/downloads
          cp docs/commonspec/build/www/* _gh-pages/commonspec/
          cp docs/commonspec/build/docx/*.docx _gh-pages/commonspec/downloads/

          # SpecIR schema specification
          rm -rf _gh-pages/specir
          mkdir -p _gh-pages/specir/downloads
          cp docs/specir/build/www/* _gh-pages/specir/
          cp docs/specir/build/docx/*.docx _gh-pages/specir/downloads/

          # Site root
          cp docs/build/index.html _gh-pages/index.html
          rm -rf _gh-pages/assets
          cp -R assets _gh-pages/assets
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md _gh-pages/
          touch _gh-pages/.nojekyll

          # Do not publish an incomplete tree.
          test -s _gh-pages/index.html
          test -s _gh-pages/engineering/index.html
          test -s _gh-pages/manual/index.html
          test -s _gh-pages/commonspec/index.html
          test -s _gh-pages/specir/index.html

          # Commit and push
          cd _gh-pages
          git add -A
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          git commit -m "Deploy documentation from ${GITHUB_REF_NAME}"
          git push origin HEAD:gh-pages
