# Build, test, and publish the SpecCompiler image.
#
# ONE image (Dockerfile, ubuntu:24.04): stock apt pandoc + our four C
# extensions + Lua source + the optional renderers (deno for model-owned
# charts, JRE/PlantUML/graphviz for puml, python/reqif for interop).
# No toolchain image, no pandoc/GHC compilation, no variants.
#
# Published tags: :latest / :<sha> / semver — what users and model overlays
# (e.g. specc-abnt) consume.
name: Build, Test, and Publish

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'models/**'
      - 'tests/**'
      - 'scripts/**'
      - 'assets/**'
      - 'Dockerfile'
      - '.github/workflows/docker-publish.yml'
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'models/**'
      - 'tests/**'
      - 'scripts/**'
      - 'assets/**'
      - 'Dockerfile'
      - '.github/workflows/docker-publish.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.imgref.outputs.ref }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      - name: Export image ref for docs
        id: imgref
        if: github.event_name != 'pull_request'
        run: echo "ref=${REGISTRY}/${IMAGE_NAME}:${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Make package public
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          curl -sf -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/${PACKAGE_NAME}" \
            -d '{"visibility":"public"}' || echo "::warning::Could not set package visibility to public"

      - name: Run tests
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e SPECCOMPILER_HOME=/workspace \
            -e SPECCOMPILER_DIST=/opt/speccompiler \
            --entrypoint bash \
            "${IMAGE}" \
            tests/run.sh --coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: tests/reports/coverage/
          retention-days: 30

      - name: Fix coverage paths for Codecov
        if: always()
        run: |
          if [ -f tests/reports/coverage/merged.lcov ]; then
            sed -i 's|SF:/workspace/|SF:|g' tests/reports/coverage/merged.lcov
          else
            echo "::notice::No coverage report generated (luacov is not present in the image); skipping Codecov upload."
          fi

      - name: Upload coverage to Codecov
        if: always() && hashFiles('tests/reports/coverage/merged.lcov') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: tests/reports/coverage/merged.lcov
          disable_search: true
          fail_ci_if_error: false

  # Auto-deploy the docs to gh-pages on every `v*` release tag, using the image
  # just built/pushed by build-and-test (so no separate `docs*` tag is needed).
  deploy-docs:
    name: Deploy documentation
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/deploy-docs.yml
    with:
      image: ${{ needs.build-and-test.outputs.image }}
    secrets: inherit

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build documentation
        run: |
          mkdir -p release-docs/html5
          for project in \
            docs/engineering_docs/project.yaml \
            docs/user_docs/project.yaml \
            docs/commonspec/project.yaml \
            docs/specir/project.yaml; do
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -v "${{ github.workspace }}:/workspace" \
              -w /workspace \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}" \
              build "$project"
          done
          cp docs/engineering_docs/build/docx/*.docx release-docs/ 2>/dev/null || true
          cp docs/engineering_docs/build/www/index.html release-docs/html5/engineering.html 2>/dev/null || true
          cp docs/user_docs/build/docx/*.docx release-docs/ 2>/dev/null || true
          cp docs/user_docs/build/www/index.html release-docs/html5/manual.html 2>/dev/null || true
          cp docs/commonspec/build/docx/*.docx release-docs/ 2>/dev/null || true
          cp docs/commonspec/build/www/index.html release-docs/html5/commonspec.html 2>/dev/null || true
          cp docs/specir/build/docx/*.docx release-docs/ 2>/dev/null || true
          cp docs/specir/build/www/index.html release-docs/html5/specir.html 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-docs/*.docx
            release-docs/html5/*.html
            THIRD_PARTY_NOTICES
          generate_release_notes: true
          body: |
            ## Install (container — Linux/macOS/WSL2)

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash
            ```

            ## Install (container — Windows PowerShell)

            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.ps1 | iex
            ```

            ## Install (native — Ubuntu 24.04)

            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd SpecCompiler && bash scripts/install-native.sh
            ```

            ## Docker Image

            One image on Ubuntu 24.04 — stock apt pandoc + compiled Lua extensions + renderers:

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```
