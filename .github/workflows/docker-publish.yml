# Build, test, and publish the SpecCompiler image.
#
# The image is a thin overlay on the OFFICIAL pandoc image (Dockerfile.lean):
# stock pandoc + our four C extensions + Lua source. There is no toolchain
# image and no pandoc/GHC compilation — that was the pre-lean build
# (Dockerfile, kept as the maintainer/air-gapped path).
#
# Published tags:
#   :latest / :<sha> / semver  — the `full` target (core + deno/charts +
#                                plantuml), what users and model overlays
#                                (e.g. specc-abnt) consume.
#   :lean                      — the core-only target (no external renderers).
name: Build, Test, and Publish

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'models/**'
      - 'tests/**'
      - 'scripts/**'
      - 'assets/**'
      - 'Dockerfile.lean'
      - '.github/workflows/docker-publish.yml'
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'models/**'
      - 'tests/**'
      - 'scripts/**'
      - 'assets/**'
      - 'Dockerfile.lean'
      - '.github/workflows/docker-publish.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push (full)
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lean
          target: full
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lean
          cache-to: type=gha,mode=max,scope=lean

      - name: Build and push (lean core)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lean
          target: lean
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:lean
          cache-from: type=gha,scope=lean
          cache-to: type=gha,mode=max,scope=lean

      - name: Make package public
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          curl -sf -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/${PACKAGE_NAME}" \
            -d '{"visibility":"public"}' || echo "::warning::Could not set package visibility to public"

      - name: Run tests
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e SPECCOMPILER_HOME=/workspace \
            -e SPECCOMPILER_DIST=/opt/speccompiler \
            --entrypoint bash \
            "${IMAGE}" \
            tests/run.sh --coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: tests/reports/coverage/
          retention-days: 30

      - name: Fix coverage paths for Codecov
        if: always()
        run: sed -i 's|SF:/workspace/|SF:|g' tests/reports/coverage/merged.lcov

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: tests/reports/coverage/merged.lcov
          disable_search: true
          fail_ci_if_error: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build documentation
        run: |
          mkdir -p release-docs/html5
          for project in \
            docs/engineering_docs/project.yaml \
            docs/user_docs/project.yaml \
            docs/commonspec/project.yaml \
            docs/specir/project.yaml; do
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -v "${{ github.workspace }}:/workspace" \
              -w /workspace \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}" \
              build "$project"
          done
          cp docs/engineering_docs/build/docx/*.docx release-docs/ 2>/dev/null || true
          cp docs/engineering_docs/build/www/index.html release-docs/html5/engineering.html 2>/dev/null || true
          cp docs/user_docs/build/docx/*.docx release-docs/ 2>/dev/null || true
          cp docs/user_docs/build/www/index.html release-docs/html5/manual.html 2>/dev/null || true
          cp docs/commonspec/build/docx/*.docx release-docs/ 2>/dev/null || true
          cp docs/commonspec/build/www/index.html release-docs/html5/commonspec.html 2>/dev/null || true
          cp docs/specir/build/docx/*.docx release-docs/ 2>/dev/null || true
          cp docs/specir/build/www/index.html release-docs/html5/specir.html 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-docs/*.docx
            release-docs/html5/*.html
            THIRD_PARTY_NOTICES
          generate_release_notes: true
          body: |
            ## Install (native, stock pandoc)

            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd SpecCompiler && bash scripts/install-native.sh
            ```

            ## Docker Image

            Thin overlay on the official pandoc image — no compiler toolchain:

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            # core-only variant (no chart/plantuml renderers):
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:lean
            ```
