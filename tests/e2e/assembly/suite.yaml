# E2E Test Suite: Assembly
# Verifies document assembly: file_seq ordering and heading-hierarchy well-formedness.
#
# Traceability (docs/engineering_docs):
#   HLR-OUT-001 Document Assembly   - preserves file_seq order; adjusts header
#                                     levels for cross-file includes
#   HLR-PIPE-008 Include Expansion  - include nesting / path resolution
#
# Test case -> VC mapping:
#   vc_out_001_01_assembly_order    -> VC-OUT-001  document ordering with includes
#   vc_out_008_01_heading_hierarchy -> VC-OUT-008  deep-include multi-level: standalone
#                                                   files shifted at each include point;
#                                                   asserts real DOCX Heading styles
#                                                   (siblings / children / ascending)
#   vc_out_008_02_broken_hierarchy  -> VC-OUT-008  object_broken_hierarchy rejects
#                                                   skipped levels, orphaned roots,
#                                                   and empty headings; leaves valid
#                                                   hierarchies untouched
#   vc_out_009_01_section_close     -> VC-OUT-009  `----` closes a section's scope
#                                                   (end_line truncates), the marker is
#                                                   consumed, trailing content keeps order
#                                                   [HLR-PIPE-012]
#   vc_out_010_01_cross_format_levels -> VC-OUT-010  LaTeX and DOCX render the same
#                                                   heading at the same depth (no
#                                                   cross-format nesting divergence)
#   vc_out_011_01_include_level_shift -> VC-OUT-011  include expansion shifts included
#                                                   headings by the level at the include
#                                                   point; nested shifts compose; `----`
#                                                   pops the context [LLR-071]
#   vc_out_011_02_include_level_combos -> VC-OUT-011  shift combinations: multi-section
#                                                   files, multi-path blocks, sibling
#                                                   includes, includes under `###`,
#                                                   double `----` pops, internal `----`
#                                                   + nested include
#   vc_out_011_03_include_level_guards -> VC-OUT-011  compatibility + guard rails:
#                                                   roots at `##`/`###` normalize;
#                                                   relative gaps remain invalid;
#                                                   levels 7+ remain distinct
#   vc_out_012_01_section_attribute_card -> VC-OUT-012  hook-less objects (SECTION)
#                                                   get the default render: heading
#                                                   at -1 with PID anchor, attribute
#                                                   card, no raw blockquote leakage
#   vc_out_012_02_include_composite_child -> VC-OUT-012  included composite stays a
#                                                   child of the including object:
#                                                   heading depth and PID depth anchor
#                                                   to level 2 = depth 1, not to the
#                                                   observed composite minimum
#   vc_out_012_03_hierarchical_pid_per_type -> VC-OUT-012  hierarchical PIDs respect
#                                                   the type's pid_prefix, keep one
#                                                   counter chain per type, and bump
#                                                   past explicit-PID collisions

project:
